##### PREFIX #####
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### GENERAL #####
set -g history-limit 100000
set -g mouse on
set -g mode-keys vi

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

##### DISABLE PANES (TABS ONLY) #####
unbind %
unbind '"'

##### PREFIXLESS TAB SWITCHING #####
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-h previous-window
bind -n M-l next-window

##### WINDOW MANAGEMENT #####
bind c new-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind & kill-window

##### COPY MODE (VIM STYLE) #####
bind -T copy-mode-vi v send-keys -X begin-selection
# yank handled by tmux-yank

##### STATUS BAR (NO GREEN, TABS ONLY) #####
set -g status on
set -g status-left ""
set -g status-right ""

set -g status-style bg=default,fg=white
set -g window-status-style bg=default,fg=white
set -g window-status-current-style bg=default,fg=white,reverse

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

##### TERMINAL COLOR FIX (IMPORTANT FOR WSL / WINDOWS TERMINAL) #####
set -ga terminal-overrides ",xterm-256color:Tc"

